  <script>
    const info = document.getElementById("info");
    const title = document.getElementById("info-title");
    const desc = document.getElementById("info-desc");

    document.querySelectorAll(".item").forEach(item => {
      item.addEventListener("click", () => {
        title.textContent = item.dataset.title;
        desc.textContent = item.dataset.desc;
        info.classList.add("open");
      });
    });

    document.querySelectorAll(".item video").forEach(video => {
      const item = video.closest(".item");

      const trigger = () => {
        if (video.paused) video.play().catch(err => console.log("play failed:", video.src, err));
      };

      item.addEventListener("mouseenter", trigger);
      item.addEventListener("focus", trigger);
      item.addEventListener("click", trigger); // for touch screens

      video.addEventListener("ended", () => { video.currentTime = 0; });
    });

    document.getElementById("info-close").addEventListener("click", () => {
      info.classList.remove("open");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") info.classList.remove("open");
    });
  </script>
